<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1614" />
    <meta name="description" content="Gestor de tareas inteligente con captura en lenguaje natural, capacidad de día y time-blocking" />
    <!-- El icono de la PESTAÑA, el del marcador y el de la barra del navegador.
     No es el mismo fichero que public/icon.svg, y no puede serlo: este se ve a
     15-32px. Ahí el logo entero no se lee (medido a 16px: 44 pixeles de 256 y
     sueltos, un chisporroteo), asi que public/favicon.svg lleva solo la A con
     su degradado y el sol, y las patas y el travesano son mas gruesos que en el
     icono grande.

     El PNG va primero por Safari, que no aplica el SVG de forma fiable en la
     pestana. Y este tampoco lleva el base64 de antes, que era el check azul de
     la plantilla de Vite. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- iPhone: esta etiqueta, y NO el manifest. Safari no lee el manifest para
         el icono de la pantalla de inicio; sin esto hace una captura de
         pantalla de la página, que es lo que pasaba. La genera `npm run iconos`
         desde public/icon.svg, y es un PNG cuadrado a sangre porque iOS aplica
         su propio redondeo: si el fichero trajera esquinas ya redondeadas se
         verían «orejas». -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mis Tareas</title>
    <!-- Fraunces: serif cálida y editorial (inspiración Anthropic) para títulos.
         Se carga con display=swap para no bloquear el primer paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <script>
      /* Aplica el tema ANTES del primer paint para evitar el parpadeo.
         Debe ser inline y síncrono: si va en main.tsx el usuario ya
         habría visto un frame con el tema equivocado. */
      (function () {
        try {
          var KEY = "ald-a:style-theme";
          var DEFAULT = "warm-tech";
          var id = null;
          try { id = localStorage.getItem(KEY); } catch (e) {}
          if (!id) id = DEFAULT;
          document.documentElement.setAttribute("data-theme", id);
          /* Tono del CONTENIDO (fichas) -> clase .light/.dark para las
             variantes de Tailwind. OJO: es una copia manual de
             `mode` en src/store/themes.ts; si añades un tema, cambia
             las dos. Gabinete es "light" porque su contenido va sobre
             pergamino, aunque su pared sea oscura. */
          var light = { "editorial-calido":1, "digital-craft":1, "partitura":1, "tinta-viva":1, "gabinete":1 };
          var isLight = !!light[id];
          /* Tono del MARCO -> color-scheme (barras, controles).
             Los temas bitonos lo separan del modo del contenido. */
          var darkChrome = { "warm-tech":1, "cronodisco":1, "gabinete":1 };
          var el = document.documentElement;
          el.classList.toggle("light", isLight);
          el.classList.toggle("dark", !isLight);
          el.style.colorScheme = darkChrome[id] ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
