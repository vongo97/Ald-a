    <title>Mis Tareas</title>
    <script>
      /* Aplica el tema ANTES del primer paint para evitar el parpadeo
         oscuro→claro. Debe ser inline y síncrono: si va en main.tsx el
         usuario ya habría visto un frame con el tema equivocado. */
      (function () {
        try {
          var p = null;
          try { p = localStorage.getItem("ald-a:theme"); } catch (e) {}
          // Mismos casos que readThemePref() en src/store/theme.ts. Si aquí
          // y en el store no se interpretan igual, React repinta el tema al
          // montar y se ve un parpadeo en el primer frame.
          var dark =
            p === "light" ? false :
            p === "system" ? !window.matchMedia("(prefers-color-scheme: light)").matches :
            true;
          var el = document.documentElement;
          el.classList.toggle("light", !dark);
          el.classList.toggle("dark", dark);
          el.style.colorScheme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#0f172a" : "#f8fafc");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
