<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1614" />
    <meta name="description" content="Gestor de tareas inteligente con captura en lenguaje natural, capacidad de día y time-blocking" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIiBmaWxsPSIjMGYxNzJhIi8+PHBhdGggZD0iTTI1IDUwIEw0MCA2NSBMNzUgMzAiIHN0cm9rZT0iIzM4YmRmOCIgc3Ryb2tlLXdpZHRoPSI4IiBmaWxsPSJub25lIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4=" />
    <title>Mis Tareas</title>
    <!-- Fraunces: serif cálida y editorial (inspiración Anthropic) para títulos.
         Se carga con display=swap para no bloquear el primer paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <script>
      /* Aplica el tema ANTES del primer paint para evitar el parpadeo.
         Debe ser inline y síncrono: si va en main.tsx el usuario ya
         habría visto un frame con el tema equivocado. */
      (function () {
        try {
          var KEY = "ald-a:style-theme";
          var DEFAULT = "warm-tech";
          var id = null;
          try { id = localStorage.getItem(KEY); } catch (e) {}
          if (!id) id = DEFAULT;
          document.documentElement.setAttribute("data-theme", id);
          /* Tono del CONTENIDO (fichas) -> clase .light/.dark para las
             variantes de Tailwind. OJO: es una copia manual de
             `mode` en src/store/themes.ts; si añades un tema, cambia
             las dos. Gabinete es "light" porque su contenido va sobre
             pergamino, aunque su pared sea oscura. */
          var light = { "editorial-calido":1, "digital-craft":1, "partitura":1, "tinta-viva":1, "gabinete":1 };
          var isLight = !!light[id];
          /* Tono del MARCO -> color-scheme (barras, controles).
             Los temas bitonos lo separan del modo del contenido. */
          var darkChrome = { "warm-tech":1, "cronodisco":1, "gabinete":1 };
          var el = document.documentElement;
          el.classList.toggle("light", isLight);
          el.classList.toggle("dark", !isLight);
          el.style.colorScheme = darkChrome[id] ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
